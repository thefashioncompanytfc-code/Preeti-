<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Preeti 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MAIN BIRTHDAY STAGE
    ========================================== -->

    <main id="birthday-stage" class="birthday-stage">

        <!-- Background -->
        <div class="stage-background">

            <!-- Decorative lights -->
            <div class="stage-lights">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Birthday Wall -->
            <section class="birthday-wall">

                <div class="wall-decoration wall-decoration-left"></div>
                <div class="wall-decoration wall-decoration-right"></div>

                <div class="birthday-sign">
                    <p class="small-title">A SPECIAL DAY FOR</p>

                    <h1>
                        Happy Birthday
                    </h1>

                    <h2>
                        Preeti
                    </h2>
                </div>

            </section>


            <!-- =====================================
                 PEOPLE
            ====================================== -->

            <section class="birthday-people" aria-label="Birthday guests">

                <!-- Mummy -->
                <div class="character character-mom" data-character="mom">
                    <div class="character-placeholder">
                        <span>👩</span>
                    </div>
                    <p>Mummy</p>
                </div>


                <!-- Birthday Girl -->
                <div class="character birthday-girl" data-character="preeti">

                    <div class="character-placeholder">
                        <span>👧</span>
                    </div>

                    <p>Preeti</p>

                </div>


                <!-- Papa -->
                <div class="character character-dad" data-character="dad">
                    <div class="character-placeholder">
                        <span>👨</span>
                    </div>
                    <p>Papa</p>
                </div>


                <!-- Friend 1 -->
                <div class="character character-friend friend-one" data-character="friend-one">
                    <div class="character-placeholder">
                        <span>🧑</span>
                    </div>
                </div>


                <!-- Friend 2 -->
                <div class="character character-friend friend-two" data-character="friend-two">
                    <div class="character-placeholder">
                        <span>👩</span>
                    </div>
                </div>

            </section>


            <!-- =====================================
                 BIRTHDAY TABLE
            ====================================== -->

            <section class="birthday-table">

                <div class="table-top"></div>
                <div class="table-front"></div>

                <!-- Cake -->
                <div class="cake-area">

                    <div class="cake">

                        <div class="cake-top"></div>

                        <div class="cake-body">
                            <div class="cake-decoration"></div>
                            <div class="cake-decoration"></div>
                            <div class="cake-decoration"></div>
                        </div>

                        <!-- Candles -->
                        <div class="candles">

                            <div class="candle candle-one">
                                <div class="flame"></div>
                            </div>

                            <div class="candle candle-two">
                                <div class="flame"></div>
                            </div>

                            <div class="candle candle-three">
                                <div class="flame"></div>
                            </div>

                        </div>

                    </div>

                </div>

            </section>


            <!-- =====================================
                 DECORATIONS
            ====================================== -->

            <div class="balloons" aria-hidden="true">

                <div class="balloon balloon-one"></div>
                <div class="balloon balloon-two"></div>
                <div class="balloon balloon-three"></div>
                <div class="balloon balloon-four"></div>

            </div>


            <div class="gift-boxes" aria-hidden="true">

                <div class="gift gift-one"></div>
                <div class="gift gift-two"></div>

            </div>


            <!-- Confetti container -->
            <div id="confetti-container" aria-hidden="true"></div>


            <!-- =====================================
                 CURTAINS
            ====================================== -->

            <div id="curtain-container" class="curtain-container">

                <!-- Left Curtain -->
                <div id="left-curtain" class="curtain curtain-left">

                    <div class="curtain-folds"></div>

                    <div class="curtain-gold-trim"></div>

                </div>


                <!-- Right Curtain -->
                <div id="right-curtain" class="curtain curtain-right">

                    <div class="curtain-folds"></div>

                    <div class="curtain-gold-trim"></div>

                </div>

            </div>


        </div>


        <!-- =========================================
             OPENING MESSAGE / INTERACTION
        ========================================== -->

        <div id="opening-message" class="opening-message">

            <p class="opening-small-text">
                A little birthday surprise...
            </p>

            <button id="start-button" class="start-button">
                Open the Curtains
            </button>

        </div>


        <!-- =========================================
             CANDLE INTERACTION
        ========================================== -->

        <div id="candle-message" class="candle-message hidden">

            <div class="message-card">

                <span class="message-icon">🎂</span>

                <h3>
                    Make a wish!
                </h3>

                <p>
                    Blow out the candles to continue.
                </p>

                <button id="blow-button" class="blow-button">
                    Blow the Candles 🕯️
                </button>

            </div>

        </div>


        <!-- =========================================
             NEXT SCENE
        ========================================== -->

        <section id="next-scene" class="next-scene hidden">

            <div class="next-scene-content">

                <p class="next-small-text">
                    The celebration begins...
                </p>

                <h2>
                    🎉 Happy Birthday, Preeti! 🎉
                </h2>

                <button id="continue-button" class="continue-button">
                    Continue →
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>
    </html>
