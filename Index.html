<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating bubbles -->
    <div class="bubble" style="left: 10%; width: 25px; height: 25px; animation-duration: 7s;"></div>
    <div class="bubble" style="left: 25%; width: 15px; height: 15px; animation-duration: 9s;"></div>
    <div class="bubble" style="left: 45%; width: 30px; height: 30px; animation-duration: 8s;"></div>
    <div class="bubble" style="left: 65%; width: 18px; height: 18px; animation-duration: 10s;"></div>
    <div class="bubble" style="left: 85%; width: 24px; height: 24px; animation-duration: 7s;"></div>

    <!-- Balloons -->
    <div class="balloon" style="left: 8%; animation-delay: 1s;"></div>
    <div class="balloon" style="left: 30%; animation-delay: 4s;"></div>
    <div class="balloon" style="left: 55%; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 78%; animation-delay: 5s;"></div>

    <div class="container">

        <div class="message">
            <h1>Happy Birthday! 🎂</h1>
            <p>Have a great year ahead ✨</p>
        </div>

        <div class="cake">
            🎂
        </div>

    </div>

    <script src="script.js"></script>

</body>
  </html>
